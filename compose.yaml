services:
  db:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: peopleos
      POSTGRES_USER: peopleos
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U peopleos -d peopleos"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: local
      DATABASE_URL: jdbc:postgresql://db:5432/peopleos
      DATABASE_USER: peopleos
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Set DEMO_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:8080/actuator/health]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
volumes:
  postgres-data:
