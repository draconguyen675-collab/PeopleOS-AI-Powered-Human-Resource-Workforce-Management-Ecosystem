spring.application.name=peopleos
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/peopleos}
spring.datasource.username=${DATABASE_USER:peopleos}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=lax
server.forward-headers-strategy=none
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
springdoc.api-docs.path=/api/v1/openapi
springdoc.swagger-ui.enabled=false
peopleos.demo.enabled=false
logging.structured.format.console=logstash
